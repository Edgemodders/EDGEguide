# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEguide
url: https://edgemodders.github.io
baseurl: /EDGEguide
repo: https://github.com/Edgemodders/EDGEguide

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: EDGEkit
    url: https://edgemodders.github.io/EDGEkit/
  - title: EDGEchat
    url: https://edgemodders.github.io/EDGEchat/
